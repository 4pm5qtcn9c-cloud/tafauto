<meta charset="UTF-8"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#111;color:#eee;min-height:100vh}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.box{background:#1c1c1c;border-radius:12px;padding:2rem;width:100%;max-width:340px}
.box h2{color:#c9a84c;font-size:1.1rem;letter-spacing:3px;margin-bottom:0.3rem;font-weight:400}
.box p{color:#666;font-size:0.7rem;letter-spacing:1px;margin-bottom:2rem}
label{display:block;color:#888;font-size:0.65rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
input[type=password],input[type=text],input[type=number],input[type=url],textarea,select{width:100%;padding:12px;background:#0a0a0a;border:1px solid #333;border-radius:6px;color:#eee;font-size:0.9rem;margin-bottom:1rem;-webkit-appearance:none;outline:none}
.btn{display:block;width:100%;padding:14px;background:#c9a84c;color:#111;border:none;border-radius:6px;font-size:0.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{background:#e0bb6a}
#err{color:#f66;font-size:0.8rem;margin-top:0.75rem;display:none;text-align:center}
#admin{display:none;padding:1.5rem;max-width:700px;margin:0 auto}
.adm-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #333}
.adm-h span{color:#c9a84c;letter-spacing:3px;font-size:1rem}
.btn-sm{background:transparent;border:1px solid #444;color:#888;padding:8px 16px;border-radius:4px;font-size:0.7rem;cursor:pointer;letter-spacing:1px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:auto}
.btn-sm:active{background:#222}
.stit{color:#c9a84c;letter-spacing:2px;font-size:0.8rem;margin:2rem 0 1rem;text-transform:uppercase}
.fbox{background:#1c1c1c;border-radius:8px;padding:1.5rem;margin-bottom:2rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
@media(max-width:500px){.g2{grid-template-columns:1fr}}
.ok{color:#5BAD78;font-size:0.8rem;margin-top:0.75rem;display:none}
.er{color:#f66;font-size:0.8rem;margin-top:0.75rem;display:none}
.si{background:#1c1c1c;border-radius:8px;padding:1rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.si img{width:72px;height:48px;object-fit:cover;border-radius:4px;flex-shrink:0}
.si-name{color:#eee;font-size:0.9rem}
.si-det{color:#666;font-size:0.7rem}
.si-price{color:#c9a84c;font-size:0.9rem;margin-left:auto;margin-right:0.75rem;white-space:nowrap}
.btn-del{background:#3A1414;border:1px solid #5A2020;color:#f66;padding:8px 12px;border-radius:4px;font-size:0.7rem;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:auto}
.btn-del:active{background:#5A2020}
.loading{color:#666;font-size:0.8rem;padding:2rem;text-align:center}
.img-slot{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.6rem}
.img-slot input{flex:1;margin-bottom:0}
.img-slot .btn-upload{background:#1a3a1a;border:1px solid #2a6a2a;color:#5BAD78;padding:10px 14px;border-radius:6px;font-size:0.7rem;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:auto;flex-shrink:0}
.img-slot .btn-upload:active{background:#2a5a2a}
.img-slot .btn-upload.loading-img{background:#222;border-color:#444;color:#888;pointer-events:none}
.img-slot .img-prev{width:48px;height:36px;object-fit:cover;border-radius:4px;display:none;flex-shrink:0}
.img-upload-hidden{display:none}
.imgs-note{font-size:0.65rem;color:#666;letter-spacing:0.5px;margin-bottom:1rem;font-style:italic}

    img21:g("f-img21").value.trim()||null,
    img22:g("f-img22").value.trim()||null,
    img23:g("f-img23").value.trim()||null,
    img24:g("f-img24").value.trim()||null,
    img25:g("f-img25").value.trim()||null,
    descr:g("f-desc").value.trim()||null
  };
  var isEdit = !!editingId;
  var url = isEdit ? (SB+"/rest/v1/masini?id=eq."+editingId) : (SB+"/rest/v1/masini");
  var method = isEdit ? "PATCH" : "POST";
  fetch(url,{
    method:method,
    headers:{"apikey":SK,"Authorization":"Bearer "+SK,"Content-Type":"application/json","Prefer":"return=minimal"},
    body:JSON.stringify(body)
  }).then(function(r){
    if(r.ok||r.status===201){
      g("ok").style.display="block";g("er").style.display="none";
      g("ok").textContent = isEdit ? "✓ Mașină actualizată cu succes!" : "✓ Mașină adăugată cu succes!";
      setTimeout(function(){g("ok").style.display="none";},3000);
      ["f-make","f-model","f-year","f-km","f-engine","f-power","f-gearbox","f-color","f-warranty","f-price","f-img1","f-img2","f-img3","f-img4","f-img5","f-img6","f-img7","f-img8","f-img9","f-img10","f-img11","f-img12","f-img13","f-img14","f-img15","f-img16","f-img17","f-img18","f-img19","f-img20","f-img21","f-img22","f-img23","f-img24","f-img25","f-desc"].forEach(function(id){g(id).value="";});
      g("f-status").value="Disponibil";
      g("f-tva").checked=false;
      cancelEdit();
      loadStoc();
    }else{
      r.text().then(function(t){console.error(t);g("er").style.display="block";g("ok").style.display="none";});
    }
  }).catch(function(e){console.error(e);g("er").style.display="block";});
});

function cancelEdit(){
  editingId=null;
  g("add-btn").textContent="ADAUGĂ ÎN STOC";
  g("cancel-edit-btn").style.display="none";
  window.scrollTo({top:0,behavior:"smooth"});
}

g("cancel-edit-btn").addEventListener("click",function(){
  ["f-make","f-model","f-year","f-km","f-engine","f-power","f-gearbox","f-color","f-warranty","f-price","f-img1","f-img2","f-img3","f-img4","f-img5","f-img6","f-img7","f-img8","f-img9","f-img10","f-img11","f-img12","f-img13","f-img14","f-img15","f-img16","f-img17","f-img18","f-img19","f-img20","f-img21","f-img22","f-img23","f-img24","f-img25","f-desc"].forEach(function(id){g(id).value="";});
  g("f-status").value="Disponibil";
  g("f-tva").checked=false;
  cancelEdit();
});

function startEdit(c){
  editingId=c.id;
  g("f-make").value=c.make||"";
  g("f-model").value=c.model||"";
  g("f-year").value=c.year||"";
  g("f-km").value=c.km||"";
  g("f-engine").value=c.engine||"";
  g("f-power").value=c.power||"";
  g("f-gearbox").value=c.gearbox||"";
  g("f-color").value=c.color||"";
  g("f-warranty").value=c.warranty||"";
  g("f-price").value=c.price||"";
  g("f-status").value=c.status||"Disponibil";
  g("f-tva").checked=!!c.tva_deductibil;
  for(var i=1;i<=25;i++){
    var el=g("f-img"+i);
    if(el) el.value=c["img"+i]||"";
  }
  g("f-desc").value=c.descr||"";
  g("add-btn").textContent="SALVEAZĂ MODIFICĂRILE";
  g("cancel-edit-btn").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function loadStoc(){
  var el=g("stoc"); el.innerHTML='<div class="loading">Se încarcă...</div>';
  fetch(SB+"/rest/v1/masini?select=*&order=created_at.desc",{headers:{"apikey":SK,"Authorization":"Bearer "+SK}})
  .then(function(r){return r.json();})
  .then(function(data){
    if(!data||!data.length){el.innerHTML='<div class="loading">Nicio mașină.</div>';return;}
    el.innerHTML="";
    data.forEach(function(c){
      var d=document.createElement("div"); d.className="si";
      if(c.img1){var img=document.createElement("img");img.src=c.img1;img.onerror=function(){this.style.display="none";};d.appendChild(img);}
      var info=document.createElement("div"); info.style.flex="1";
      info.innerHTML='<div class="si-name">'+(c.make||"")+" "+(c.model||"")+" "+(c.year||"")+'</div><div class="si-det">'+(c.km||"")+(c.engine?" · "+c.engine:"")+'</div>';
      var price=document.createElement("span"); price.className="si-price"; price.textContent=c.price||"";
      var edit=document.createElement("button"); edit.className="btn-del"; edit.textContent="Editează";
      edit.style.background="transparent"; edit.style.borderColor="#444"; edit.style.color="#c9a84c";
      edit.addEventListener("click",function(){startEdit(c);});
      var del=document.createElement("button"); del.className="btn-del"; del.textContent="Șterge";
      del.addEventListener("click",function(){if(confirm("Ștergi această mașină?"))fetch(SB+"/rest/v1/masini?id=eq."+c.id,{method:"DELETE",headers:{"apikey":SK,"Authorization":"Bearer "+SK}}).then(loadStoc);});
      d.appendChild(info); d.appendChild(price); d.appendChild(edit); d.appendChild(del);
      el.appendChild(d);
    });
  }).catch(function(){el.innerHTML='<div class="loading">Eroare la încărcare.</div>';});
}

// ImgBB Upload
var IMGBB_KEY = "00b40b7b6d674245d061d81c5284cc73";

function triggerUpload(n){
  document.getElementById("file"+n).click();
}

function uploadToImgBB(n, input){
  var file = input.files[0];
  if(!file) return;
  var btn = input.previousElementSibling.querySelector(".btn-upload");
  btn.textContent = "SE INCARCA...";
  btn.classList.add("loading-img");
  var fd = new FormData();
  fd.append("image", file);
  fetch("https://api.imgbb.com/1/upload?key="+IMGBB_KEY, {
    method: "POST",
    body: fd
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.success){
      var url = data.data.url;
      document.getElementById("f-img"+n).value = url;
      var prev = document.getElementById("prev"+n);
      prev.src = url;
      prev.style.display = "block";
      btn.textContent = "✓ INCARCAT";
      btn.style.background = "#0a2a0a";
      setTimeout(function(){
        btn.textContent = "INLOCUIESTE";
        btn.classList.remove("loading-img");
      }, 2000);
    } else {
      btn.textContent = "EROARE";
      btn.classList.remove("loading-img");
      setTimeout(function(){ btn.textContent = "INCEARCA DIN NOU"; }, 2000);
    }
    input.value = "";
  }).catch(function(){
    btn.textContent = "EROARE RETEA";
    btn.classList.remove("loading-img");
    input.value = "";
  });
}

// Populate image previews when editing
var _origStartEdit = startEdit;
startEdit = function(c){
  _origStartEdit(c);
  for(var i=1;i<=25;i++){
    var val = c["img"+i];
    var prev = document.getElementById("prev"+i);
    var btn = document.querySelector("#file"+i).previousElementSibling.querySelector(".btn-upload");
    if(val && prev){
      prev.src = val;
      prev.style.display = "block";
      if(btn) { btn.textContent = "INLOCUIESTE"; }
    } else {
      if(prev) prev.style.display = "none";
      if(btn) { btn.textContent = "INCARCA"; }
    }
  }
};
